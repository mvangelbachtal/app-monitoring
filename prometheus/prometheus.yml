global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: 'nextcloud'
    scrape_interval: 90s
    static_configs:
      - targets: ['nextcloud-exporter:9205']

  - job_name: "authentik_server"
    static_configs:
      - targets:
          - authentik_server:9300

  - job_name: "authentik_worker"
    static_configs:
      - targets:
          - authentik_worker:9300

  - job_name: 'netcupscp'
    scrape_interval: 60s
    static_configs:
      - targets: ['netcupscp-exporter:9757']

